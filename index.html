    <style>
      @media print {
        @page {
          size: 100mm 100mm;
          margin: 0;
        }
        body {
          -webkit-print-color-adjust: exact;
          print-color-adjust: exact;
        }
        body > * {
          display: none;
        }
        #print-container, #print-container * {
          display: block;
          visibility: visible;
        }
        #print-container {
          position: absolute;
          left: 0;
          top: 0;
          width: 100%;
        }
        .label-print-page {
          width: 100mm;
          height: 100mm;
          page-break-after: always;
          box-sizing: border-box;
          overflow: hidden;
        }
      }
    </style>
